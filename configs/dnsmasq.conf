interface=wlp0s20f3
bind-interfaces
dhcp-range=192.168.50.100,192.168.50.200,12h
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1
# Upstream DNS: use China-reachable resolvers (Ali/腾讯) so domestic resolution
# works. Foreign domains resolved here may be polluted, but xray SNI sniffing
# re-routes them via the proxy node which resolves remotely.
server=223.5.5.5
server=119.29.29.29
# Also try public resolvers as fallback for non-CN domains (best effort)
server=1.1.1.1
server=8.8.8.8
cache-size=1000
no-resolv
